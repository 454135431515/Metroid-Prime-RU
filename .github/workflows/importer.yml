# Импортёр перевода одним файлом под каждую ОС порта (I3): на каждый push в код или текст —
# артефакты, по тегу v* — архивы в релиз.
name: importer
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: ["tools/**", "text/**", ".github/workflows/importer.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  freeze:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04  # glibc 2.35: собранное на новой системе не стартует на старой
            asset: russian-importer-linux-x86_64.tar.gz
          - os: windows-latest
            asset: russian-importer-windows-x86_64.zip
          - os: macos-14
            asset: russian-importer-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller Pillow numpy
      - run: sh tools/freeze.sh
      # Без порта импортёр обязан отказаться с кодом 1: значит, бинарник стартует и модули на месте.
      - name: smoke
        run: |
          exe=dist/russian; [ -f dist/russian.exe ] && exe=dist/russian.exe
          set +e; out=$("$exe" 2>&1); code=$?; set -e
          echo "$out"
          [ "$code" = 1 ] && echo "$out" | grep -q MP_MODS_DIR
      - name: pack
        run: |
          cd dist
          case "${{ matrix.asset }}" in
            *.tar.gz) tar czf "../${{ matrix.asset }}" russian ;;
            *windows*) 7z a "../${{ matrix.asset }}" russian.exe ;;
            *) zip "../${{ matrix.asset }}" russian ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Russian translation importer, see README"
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" --clobber
